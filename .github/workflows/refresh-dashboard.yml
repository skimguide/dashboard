name: Refresh work orders dashboard

on:
  schedule:
    # Every hour at :17 past, 6 AM to 7 PM Pacific (13:00-02:00 UTC; shifts an hour in winter)
    - cron: "17 13-23,0-2 * * *"
  workflow_dispatch:
    inputs:
      inspect:
        description: "Only list the fields AppFolio returns (no publish)"
        type: boolean
        default: false

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      APPFOLIO_CLIENT_ID: ${{ secrets.APPFOLIO_CLIENT_ID }}
      APPFOLIO_CLIENT_SECRET: ${{ secrets.APPFOLIO_CLIENT_SECRET }}
      APPFOLIO_SUBDOMAIN: guidemanagement
      APPFOLIO_FILTERS: ${{ vars.APPFOLIO_FILTERS }}
      WO_STATUS_CODES: ${{ vars.WO_STATUS_CODES }}
      WO_COMPLETED_DATE_CODE: ${{ vars.WO_COMPLETED_DATE_CODE }}
      MAINTENANCE_STAFF: ${{ vars.MAINTENANCE_STAFF }}
      NOT_MAINTENANCE: ${{ vars.NOT_MAINTENANCE }}
      APPFOLIO_RENEWAL_FILTERS: ${{ vars.APPFOLIO_RENEWAL_FILTERS }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Inspect AppFolio fields
        if: ${{ inputs.inspect }}
        run: python wo_dashboard.py --inspect

      - name: Build work orders page
        if: ${{ !inputs.inspect }}
        run: python wo_dashboard.py --out _site/workorders

      - name: Inspect labor report
        if: ${{ inputs.inspect }}
        run: python hours_dashboard.py --inspect

      - name: Build tech hours page
        if: ${{ !inputs.inspect }}
        continue-on-error: true
        run: python hours_dashboard.py --out _site

      - name: Inspect competition reports
        if: ${{ inputs.inspect }}
        run: python competition_dashboard.py --inspect

      - name: Build competition pages
        if: ${{ !inputs.inspect }}
        continue-on-error: true
        run: python competition_dashboard.py --out _site

      - name: Build home page
        if: ${{ !inputs.inspect }}
        run: |
          printf 'User-agent: *\nDisallow: /\n' > _site/robots.txt
          cat > _site/index.html <<'HTML'
          <!doctype html>
          <html lang="en">
          <head>
          <meta charset="utf-8">
          <meta name="robots" content="noindex, nofollow">
          <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
          <title>Guide Dashboards</title>
          <link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500&family=Barlow+Condensed:wght@700&display=swap" rel="stylesheet">
          <style>
          :root{--bg:#EEF1F4;--surface:#fff;--ink:#1C2733;--muted:#5D6B7A;--line:#D3DAE1;--accent:#1F5F8B}
          @media (prefers-color-scheme: dark){:root{--bg:#12181F;--surface:#1A222C;--ink:#E6ECF2;--muted:#93A1AF;--line:#2B3642;--accent:#76AEDB}}
          *{box-sizing:border-box}
          body{margin:0;background:var(--bg);color:var(--ink);font-family:"Barlow","Segoe UI",system-ui,sans-serif;padding:env(safe-area-inset-top,0) 0 env(safe-area-inset-bottom,0)}
          main{max-width:720px;margin:0 auto;padding:48px 20px}
          h1{font-family:"Barlow Condensed","Arial Narrow",sans-serif;font-size:clamp(32px,6vw,46px);margin:0 0 28px;line-height:1.05}
          a.card{display:block;background:var(--surface);border:1px solid var(--line);border-left:4px solid var(--accent);border-radius:8px;padding:18px 20px;margin-bottom:14px;color:inherit;text-decoration:none}
          a.card:hover,a.card:focus-visible{border-color:var(--accent)}
          a.card b{display:block;font-size:20px;font-weight:500;color:var(--accent)}
          a.card span{color:var(--muted)}
          </style>
          </head>
          <body>
          <main>
            <h1>Guide Dashboards</h1>
            <a class="card" href="workorders/"><b>Open work orders</b><span>Every open work order in AppFolio, refreshed hourly.</span></a>
            <a class="card" href="hours/"><b>Tech hours on work orders</b><span>Hours each technician logs to work orders, by day.</span></a>
            <a class="card" href="workordercomp2026/"><b>Work order competition 2026</b><span>Technician standings, Oct 8–31.</span></a>
            <a class="card" href="renewalcomp2026/"><b>Renewal competition 2026</b><span>Property manager standings through Dec 31.</span></a>
          </main>
          </body>
          </html>
          HTML

      - uses: actions/upload-pages-artifact@v3
        if: ${{ !inputs.inspect }}
        with:
          path: _site

  deploy:
    if: ${{ !inputs.inspect }}
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
