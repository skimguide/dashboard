name: Refresh lead to lease

on:
  schedule:
    # Once a morning at 13:05 UTC (6:05 AM Pacific in summer, 5:05 AM in winter). The data
    # runs through yesterday, so one run a day is all it needs. The page goes live with the
    # main workflow's 13:17 publish.
    - cron: "5 13 * * *"
  workflow_dispatch:
    inputs:
      inspect:
        description: "Only list the fields AppFolio returns (no publish)"
        type: boolean
        default: false

permissions:
  contents: write     # to save the built page to the pages-leadtolease branch
  actions: write      # to start the main dashboard workflow after a manual run

concurrency:
  group: leadtolease
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      APPFOLIO_CLIENT_ID: ${{ secrets.APPFOLIO_CLIENT_ID }}
      APPFOLIO_CLIENT_SECRET: ${{ secrets.APPFOLIO_CLIENT_SECRET }}
      APPFOLIO_SUBDOMAIN: guidemanagement
      APPFOLIO_LEASE_FILTERS: ${{ vars.APPFOLIO_LEASE_FILTERS }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Inspect AppFolio reports
        if: ${{ inputs.inspect }}
        run: python leadtolease_dashboard.py --inspect

      - name: Build page
        if: ${{ !inputs.inspect }}
        run: python leadtolease_dashboard.py --out out

      - name: Save page to the pages-leadtolease branch
        if: ${{ !inputs.inspect }}
        run: |
          cd out/leadtolease
          git init -q -b pages-leadtolease
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -q -m "lead to lease $(date -u +%Y-%m-%dT%H:%MZ)"
          git push -q -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" HEAD:pages-leadtolease

      - name: Publish now (manual runs only)
        if: ${{ github.event_name == 'workflow_dispatch' && !inputs.inspect }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run refresh-dashboard.yml --repo ${{ github.repository }}
